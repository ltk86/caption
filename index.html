<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>실시간 한글 자막</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json?v=2">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="실시간자막">
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b0b0f;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #setup {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #setup h1 {
    font-size: 18px;
    margin: 0 0 8px 0;
    color: #f5f5f5;
  }
  #setup input, #setup select, #setup button {
    font-size: 16px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1a1a20;
    color: #f5f5f5;
  }
  #setup button {
    background: #3a7bfd;
    border: none;
    font-weight: 600;
  }
  #status {
    font-size: 13px;
    color: #999;
    padding: 0 20px;
  }
  #caption {
    display: none;
    flex: 1;
    align-items: flex-end;
    justify-content: center;
    padding: 24px 16px 32px 16px;
  }
  #captionText {
    font-size: clamp(22px, 6vw, 34px);
    line-height: 1.4;
    font-weight: 600;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  }
  .interim { color: #bbb; }
  .final { color: #fff; }
  #controls {
    display: none;
    padding: 16px;
    text-align: center;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  #stopBtn, #pipBtn {
    font-size: 15px;
    padding: 10px 20px;
    border-radius: 20px;
    border: 1px solid #444;
    background: #1a1a20;
    color: #f5f5f5;
  }
</style>
</head>
<body>

  <div id="setup">
    <h1>실시간 한글 자막 설정</h1>
    <input id="key" type="password" placeholder="애저 스피치 구독 키(key)">
    <select id="srcLang">
      <option value="en-US">원본 언어: 영어</option>
      <option value="ja-JP">원본 언어: 일본어</option>
      <option value="zh-CN">원본 언어: 중국어(普通话)</option>
      <option value="es-ES">원본 언어: 스페인어</option>
      <option value="fr-FR">원본 언어: 프랑스어</option>
      <option value="de-DE">원본 언어: 독일어</option>
      <option value="it-IT">원본 언어: 이탈리아어</option>
      <option value="pt-BR">원본 언어: 포르투갈어(브라질)</option>
      <option value="ru-RU">원본 언어: 러시아어</option>
      <option value="vi-VN">원본 언어: 베트남어</option>
      <option value="th-TH">원본 언어: 태국어</option>
      <option value="id-ID">원본 언어: 인도네시아어</option>
      <option value="hi-IN">원본 언어: 힌디어</option>
      <option value="ar-SA">원본 언어: 아랍어</option>
      <option value="custom">직접 입력...</option>
    </select>
    <input id="customLang" placeholder="예: nl-NL (네덜란드어)" style="display:none;">
    <button id="startBtn">시작</button>
    <label style="font-size:13px;color:#999;display:flex;align-items:center;gap:6px;">
      <input type="checkbox" id="rememberMe" style="width:auto;padding:0;"> 이 기기에 키 저장하기
    </label>
  </div>

  <div id="status"></div>
  <div id="caption"><div id="captionText"></div></div>
  <div id="controls">
    <button id="pipBtn">PIP로 띄우기</button>
    <button id="stopBtn">중지</button>
  </div>

  <canvas id="capCanvas" width="600" height="200" style="position:fixed;bottom:0;left:0;width:2px;height:2px;opacity:0.01;pointer-events:none;"></canvas>
  <video id="pipVideo" muted playsinline webkit-playsinline autoplay style="position:fixed;bottom:0;left:4px;width:2px;height:2px;opacity:0.01;pointer-events:none;"></video>

<script>
let recognizer;
const FIXED_REGION = 'koreacentral'; // 지역 고정값, 필요시 이 값만 바꾸면 됨
let pipStreamStarted = false;

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// 캔버스에 자막 텍스트를 그려서 '가짜 비디오'로 만드는 함수 (PIP용)
function drawCaptionToCanvas(text) {
  const canvas = document.getElementById('capCanvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const w = canvas.width, h = canvas.height;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0b0b0f';
  ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 32px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // 간단한 줄바꿈 처리
  const maxWidth = w - 40;
  const words = (text || '').split(' ');
  let lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  lines = lines.slice(-3); // 최대 3줄만 표시

  const lineHeight = 40;
  const startY = h / 2 - ((lines.length - 1) * lineHeight) / 2;
  lines.forEach((l, i) => {
    ctx.fillText(l, w / 2, startY + i * lineHeight);
  });
}

// PIP용 비디오 스트림 시작 (캔버스를 실시간 스트리밍)
let lastCaptionText = '';
let pipDrawInterval = null;

function startPipStream() {
  if (pipStreamStarted) return;
  const canvas = document.getElementById('capCanvas');
  const pipVideo = document.getElementById('pipVideo');
  drawCaptionToCanvas(''); // 초기 프레임
  const stream = canvas.captureStream(15);
  pipVideo.srcObject = stream;
  pipVideo.play().catch(() => {});
  pipStreamStarted = true;

  // 백그라운드(PIP 전환 등) 상태에서도 계속 그려지도록 setInterval 사용
  // (requestAnimationFrame은 탭이 백그라운드가 되면 브라우저가 자동으로 멈춤)
  pipDrawInterval = setInterval(() => {
    drawCaptionToCanvas(lastCaptionText);
  }, 200);
}

// 저장된 값 불러오기
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('captionSettings');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      document.getElementById('key').value = s.key || '';
      const langSelect = document.getElementById('srcLang');
      const isKnown = Array.from(langSelect.options).some(o => o.value === s.srcLang);
      if (s.srcLang && !isKnown) {
        langSelect.value = 'custom';
        document.getElementById('customLang').style.display = 'block';
        document.getElementById('customLang').value = s.srcLang;
      } else {
        langSelect.value = s.srcLang || 'en-US';
      }
      document.getElementById('rememberMe').checked = true;
    } catch (e) {}
  }
});

document.getElementById('srcLang').addEventListener('change', (e) => {
  document.getElementById('customLang').style.display = (e.target.value === 'custom') ? 'block' : 'none';
});

document.getElementById('startBtn').addEventListener('click', async () => {
  const key = document.getElementById('key').value.trim();
  const region = FIXED_REGION;
  const langSelectValue = document.getElementById('srcLang').value;
  const srcLang = langSelectValue === 'custom'
    ? document.getElementById('customLang').value.trim()
    : langSelectValue;
  const remember = document.getElementById('rememberMe').checked;

  if (!key) {
    alert('구독 키를 입력해주세요.');
    return;
  }

  if (!srcLang) {
    alert('언어 코드를 입력해주세요. 예: nl-NL');
    return;
  }

  if (remember) {
    localStorage.setItem('captionSettings', JSON.stringify({ key, srcLang }));
  } else {
    localStorage.removeItem('captionSettings');
  }

  if (typeof SpeechSDK === 'undefined') {
    alert('SDK 로딩에 실패했습니다. 인터넷 연결을 확인해주세요.');
    return;
  }

  setStatus('마이크 권한을 요청하는 중...');

  try {
    const speechConfig = SpeechSDK.SpeechTranslationConfig.fromSubscription(key, region);
    speechConfig.speechRecognitionLanguage = srcLang;
    speechConfig.addTargetLanguage('ko');

    // 에코 제거/노이즈 억제를 꺼서 스피커로 재생 중인 영상 소리도 그대로 인식하도록 함
    const rawStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });
    const audioConfig = SpeechSDK.AudioConfig.fromStreamInput(rawStream);
    recognizer = new SpeechSDK.TranslationRecognizer(speechConfig, audioConfig);

    const captionText = document.getElementById('captionText');

    recognizer.recognizing = (s, e) => {
      if (e.result.translations) {
        const ko = e.result.translations.get('ko');
        if (ko) {
          captionText.innerHTML = `<span class="interim">${ko}</span>`;
          lastCaptionText = ko;
          drawCaptionToCanvas(ko);
        }
      }
    };

    recognizer.recognized = (s, e) => {
      if (e.result.reason === SpeechSDK.ResultReason.TranslatedSpeech) {
        const ko = e.result.translations.get('ko');
        if (ko) {
          captionText.innerHTML = `<span class="final">${ko}</span>`;
          lastCaptionText = ko;
          drawCaptionToCanvas(ko);
        }
      }
    };

    recognizer.canceled = (s, e) => {
      setStatus('오류: ' + e.errorDetails);
    };

    recognizer.startContinuousRecognitionAsync(
      () => {
        document.getElementById('setup').style.display = 'none';
        document.getElementById('caption').style.display = 'flex';
        document.getElementById('controls').style.display = 'flex';
        setStatus('인식 중...');
        startPipStream();
      },
      (err) => {
        setStatus('시작 실패: ' + err);
      }
    );
  } catch (err) {
    setStatus('오류 발생: ' + err.message);
  }
});

document.getElementById('pipBtn').addEventListener('click', async () => {
  const pipVideo = document.getElementById('pipVideo');
  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
      return;
    }
    await pipVideo.requestPictureInPicture();
  } catch (err) {
    alert('PIP 실행에 실패했어요: ' + err.message + '\n다시 한 번 눌러보시거나, 화면 밝기/저전력 모드를 확인해보세요.');
  }
});

document.getElementById('stopBtn').addEventListener('click', () => {
  if (recognizer) {
    recognizer.stopContinuousRecognitionAsync(() => {
      document.getElementById('setup').style.display = 'flex';
      document.getElementById('caption').style.display = 'none';
      document.getElementById('controls').style.display = 'none';
      setStatus('');
      recognizer.close();
      recognizer = null;

      const pipVideo = document.getElementById('pipVideo');
      if (document.pictureInPictureElement) {
        document.exitPictureInPicture().catch(() => {});
      }
      if (pipVideo.srcObject) {
        pipVideo.srcObject.getTracks().forEach(t => t.stop());
        pipVideo.srcObject = null;
      }
      pipStreamStarted = false;
      if (pipDrawInterval) {
        clearInterval(pipDrawInterval);
        pipDrawInterval = null;
      }
    });
  }
});
</script>

</body>
</html>
