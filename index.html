<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>실시간 한글 자막</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json?v=2">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="실시간자막">
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.51.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b0b0f;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #setup {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #setup h1 {
    font-size: 18px;
    margin: 0 0 8px 0;
    color: #f5f5f5;
  }
  #setup input, #setup select, #setup button {
    font-size: 16px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1a1a20;
    color: #f5f5f5;
  }
  #setup button {
    background: #3a7bfd;
    border: none;
    font-weight: 600;
  }
  #setup button:disabled, #controls button:disabled {
    opacity: 0.5;
  }
  #clearKeyBtn {
    background: none;
    border: none;
    color: #777;
    font-size: 12px;
    text-decoration: underline;
    padding: 4px 0;
    width: auto;
    cursor: pointer;
  }
  #status {
    font-size: 13px;
    color: #999;
    padding: 0 20px;
  }
  #status.status-ok { color: #4ade80; }
  #status.status-warn { color: #fbbf24; }
  #status.status-error { color: #ff6b6b; }
  #caption {
    display: none;
    flex: 1;
    align-items: flex-end;
    justify-content: center;
    padding: 24px 16px 32px 16px;
  }
  #captionText {
    font-size: clamp(22px, 6vw, 34px);
    line-height: 1.4;
    font-weight: 600;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  }
  #prevLine {
    opacity: 0.5;
    font-size: 0.8em;
    margin-bottom: 6px;
    min-height: 1em;
  }
  .interim { color: #bbb; }
  .final { color: #fff; }
  #controls {
    display: none;
    padding: 16px;
    text-align: center;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  #stopBtn, #pipBtn {
    font-size: 15px;
    padding: 10px 20px;
    border-radius: 20px;
    border: 1px solid #444;
    background: #1a1a20;
    color: #f5f5f5;
  }
</style>
</head>
<body>

  <div id="setup">
    <h1>실시간 한글 자막 설정</h1>
    <input id="key" type="password" placeholder="애저 스피치 구독 키(key)">
    <select id="srcLang">
      <option value="en-US">원본 언어: 영어</option>
      <option value="ja-JP">원본 언어: 일본어</option>
      <option value="zh-CN">원본 언어: 중국어(普通话)</option>
      <option value="es-ES">원본 언어: 스페인어</option>
      <option value="fr-FR">원본 언어: 프랑스어</option>
      <option value="de-DE">원본 언어: 독일어</option>
      <option value="it-IT">원본 언어: 이탈리아어</option>
      <option value="pt-BR">원본 언어: 포르투갈어(브라질)</option>
      <option value="ru-RU">원본 언어: 러시아어</option>
      <option value="vi-VN">원본 언어: 베트남어</option>
      <option value="th-TH">원본 언어: 태국어</option>
      <option value="id-ID">원본 언어: 인도네시아어</option>
      <option value="hi-IN">원본 언어: 힌디어</option>
      <option value="ar-SA">원본 언어: 아랍어</option>
      <option value="custom">직접 입력...</option>
    </select>
    <input id="customLang" placeholder="예: nl-NL (네덜란드어)" style="display:none;">
    <select id="audioSource">
      <option value="mic">오디오 입력: 마이크(스피커 소리를 다시 듣기)</option>
      <option value="display">오디오 입력: 화면/탭 오디오 공유(크롬 전용, 더 깨끗함)</option>
    </select>
    <button id="startBtn">시작</button>
    <label style="font-size:13px;color:#999;display:flex;align-items:center;gap:6px;">
      <input type="checkbox" id="rememberMe" style="width:auto;padding:0;"> 이 기기에 키 저장하기
    </label>
    <button type="button" id="clearKeyBtn">저장된 키 삭제</button>
  </div>

  <div id="status"></div>
  <div id="caption"><div id="captionText"><div id="prevLine" class="final"></div><div id="curLine"></div></div></div>
  <div id="controls">
    <button id="pipBtn">PIP로 띄우기</button>
    <button id="stopBtn">중지</button>
  </div>

  <canvas id="capCanvas" width="800" height="320" style="position:fixed;bottom:0;left:0;width:2px;height:2px;opacity:0.01;pointer-events:none;"></canvas>
  <video id="pipVideo" muted playsinline webkit-playsinline autoplay style="position:fixed;bottom:0;left:4px;width:2px;height:2px;opacity:0.01;pointer-events:none;"></video>

<script>
let recognizer;
let rawStream;
const FIXED_REGION = 'koreacentral'; // 지역 고정값, 필요시 이 값만 바꾸면 됨
let pipStreamStarted = false;

// 아이폰/아이패드(Safari, WebKit)는 canvas.captureStream() 기반 가짜 영상이 PIP 자격을
// 인정받지 못하는 경우가 많아, 실제로 디코딩되는 무음 영상 파일 + 네이티브 자막 트랙(WebVTT)
// 방식을 대신 사용한다. 크롬/안드로이드는 기존에 검증된 캔버스 방식을 그대로 쓴다.
const pipVideoEl = document.getElementById('pipVideo');
const isAppleWebKitPip = typeof pipVideoEl.webkitSupportsPresentationMode === 'function';
let nativeSubtitleTrack = null;
let nativePipReady = false;

// 재연결 관련 상태
let isManualStop = true;
let reconnectAttempts = 0;
let reconnectTimer = null;
let awaitingNetwork = false; // 오프라인이라 재시도를 보류 중인지
const MAX_RECONNECT_ATTEMPTS = 5;
let currentKey = '';
let currentSrcLang = '';
let currentAudioSource = 'mic';

// 화면 꺼짐 방지(Wake Lock) - 자막을 보는 동안 화면이 자동으로 꺼지면
// 인식 자체는 계속되지만 자막을 볼 수 없게 되므로 인식 중에는 꺼짐을 막는다.
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}
// 브라우저가 탭 전환 시 Wake Lock을 자동 해제하는 경우가 있어, 다시 돌아오면 재요청
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !isManualStop && recognizer && !wakeLock) {
    requestWakeLock();
  }
});

// 자막 두 줄(직전 문장 + 현재 문장) 표시용 상태
// finalText: curLine에 마지막으로 표시했던 텍스트(interim이든 final이든)
// prevDisplayText: prevLine(흐린 이전 줄)에 표시 중인 텍스트
let finalText = '';
let prevDisplayText = '';

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = type ? 'status-' + type : '';
}

// 텍스트를 캔버스 폭에 맞게 줄바꿈 (ctx.font가 미리 설정되어 있어야 함)
function wrapTextLines(ctx, text, maxWidth, maxLines) {
  const words = (text || '').split(' ');
  let lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines.slice(-maxLines);
}

// 캔버스에 자막 텍스트를 그려서 '가짜 비디오'로 만드는 함수 (PIP용)
// 앱 화면과 동일하게 이전 줄(흐리게, 작게)과 현재 줄(밝게, 크게)을 함께 그린다.
function drawCaptionToCanvas(mainText, prevText) {
  const canvas = document.getElementById('capCanvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const w = canvas.width, h = canvas.height;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0b0b0f';
  ctx.fillRect(0, 0, w, h);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const maxWidth = w - 40;

  // 캔버스 높이에 비례한 폰트 크기 (기기/해상도에 따라 고정 크기가 어색해지는 것을 방지)
  const mainFontSize = Math.round(h * 0.15);
  const prevFontSize = Math.round(mainFontSize * 0.7);
  const mainLineHeight = Math.round(mainFontSize * 1.25);
  const prevLineHeight = Math.round(prevFontSize * 1.25);

  ctx.font = `${prevFontSize}px -apple-system, sans-serif`;
  const prevLines = prevText ? wrapTextLines(ctx, prevText, maxWidth, 1) : [];

  ctx.font = `bold ${mainFontSize}px -apple-system, sans-serif`;
  const mainLines = wrapTextLines(ctx, mainText, maxWidth, 2);

  const gap = prevLines.length ? Math.round(mainFontSize * 0.3) : 0;
  const totalHeight = prevLines.length * prevLineHeight + gap + mainLines.length * mainLineHeight;
  let y = h / 2 - totalHeight / 2;

  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = `${prevFontSize}px -apple-system, sans-serif`;
  prevLines.forEach((l) => {
    y += prevLineHeight / 2;
    ctx.fillText(l, w / 2, y);
    y += prevLineHeight / 2;
  });

  y += gap;

  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${mainFontSize}px -apple-system, sans-serif`;
  mainLines.forEach((l) => {
    y += mainLineHeight / 2;
    ctx.fillText(l, w / 2, y);
    y += mainLineHeight / 2;
  });
}

// PIP용 비디오 스트림 시작 (캔버스를 실시간 스트리밍) - 크롬/안드로이드용
let lastCaptionText = '';
let lastPrevText = '';
let lastDrawnText = null;
let lastDrawnPrevText = null;
let pipDrawInterval = null;

// --- Safari(WebKit)용: 실제 디코딩되는 무음 영상 + 네이티브 자막 트랙(WebVTT) ---
// canvas.captureStream()으로 만든 가짜 영상은 iOS에서 PIP 자격을 인정받지 못하는
// 경우가 많아, 짧은 무음 영상을 실제로 녹화(MediaRecorder)해 파일처럼 재생시키고
// 자막은 영화 자막과 같은 방식(TextTrack/VTTCue)으로 얹는다.
async function prepareNativeSubtitlePip() {
  if (!isAppleWebKitPip || nativePipReady) return;

  const seedCanvas = document.createElement('canvas');
  seedCanvas.width = 640;
  seedCanvas.height = 360;
  const sctx = seedCanvas.getContext('2d');
  sctx.fillStyle = '#0b0b0f';
  sctx.fillRect(0, 0, seedCanvas.width, seedCanvas.height);

  const mimeCandidates = [
    'video/mp4',
    'video/mp4;codecs=avc1',
    'video/mp4;codecs=h264',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  const mimeType = (window.MediaRecorder && mimeCandidates.find(t => MediaRecorder.isTypeSupported(t))) || null;
  if (!mimeType) {
    setStatus('이 기기에서는 PIP용 영상을 만들 수 없습니다(MediaRecorder 미지원).');
    return;
  }

  const seedStream = seedCanvas.captureStream(2);
  const chunks = [];
  const recorder = new MediaRecorder(seedStream, { mimeType });
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };

  await new Promise((resolve) => {
    recorder.onstop = resolve;
    recorder.start();
    setTimeout(() => recorder.stop(), 2000);
  });
  seedStream.getTracks().forEach(t => t.stop());

  const blob = new Blob(chunks, { type: mimeType });
  const url = URL.createObjectURL(blob);

  pipVideoEl.muted = true;
  pipVideoEl.loop = true;
  pipVideoEl.src = url;

  await new Promise((resolve) => {
    pipVideoEl.onloadedmetadata = resolve;
    pipVideoEl.load();
  });

  nativeSubtitleTrack = pipVideoEl.addTextTrack('subtitles', '자막', 'ko');
  nativeSubtitleTrack.mode = 'showing';

  pipVideoEl.play().catch(() => {});
  nativePipReady = true;
}

// 자막 텍스트가 바뀔 때마다 기존 큐를 지우고 새 큐로 교체 (즉시 다시 렌더링되도록)
function updateNativeSubtitleCue(mainText, prevText) {
  if (!nativeSubtitleTrack) return;

  Array.from(nativeSubtitleTrack.cues || []).forEach(c => nativeSubtitleTrack.removeCue(c));

  const combined = [prevText, mainText].filter(Boolean).join('\n');
  if (!combined) return;

  const end = (pipVideoEl.duration && isFinite(pipVideoEl.duration)) ? pipVideoEl.duration : 86400;
  try {
    nativeSubtitleTrack.addCue(new VTTCue(0, end, combined));
  } catch (e) {}
}

function resetNativeSubtitlePip() {
  if (pipVideoEl.src) {
    URL.revokeObjectURL(pipVideoEl.src);
    pipVideoEl.removeAttribute('src');
    pipVideoEl.load();
  }
  nativeSubtitleTrack = null;
  nativePipReady = false;
}

async function startPipStream() {
  if (pipStreamStarted) return;

  if (isAppleWebKitPip) {
    await prepareNativeSubtitlePip();
    pipStreamStarted = true;
    return;
  }

  const canvas = document.getElementById('capCanvas');
  drawCaptionToCanvas('', ''); // 초기 프레임
  lastDrawnText = '';
  lastDrawnPrevText = '';
  const stream = canvas.captureStream(15);
  pipVideoEl.srcObject = stream;
  pipVideoEl.play().catch(() => {});
  pipStreamStarted = true;

  // 백그라운드(PIP 전환 등) 상태에서도 계속 그려지도록 setInterval 사용
  // (requestAnimationFrame은 탭이 백그라운드가 되면 브라우저가 자동으로 멈춤)
  // 텍스트가 바뀌지 않았으면 다시 그리지 않아 배터리 소모를 줄인다.
  pipDrawInterval = setInterval(() => {
    if (lastCaptionText === lastDrawnText && lastPrevText === lastDrawnPrevText) return;
    lastDrawnText = lastCaptionText;
    lastDrawnPrevText = lastPrevText;
    drawCaptionToCanvas(lastCaptionText, lastPrevText);
  }, 200);
}

// 저장된 값 불러오기
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('captionSettings');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      document.getElementById('key').value = s.key || '';
      const langSelect = document.getElementById('srcLang');
      const isKnown = Array.from(langSelect.options).some(o => o.value === s.srcLang);
      if (s.srcLang && !isKnown) {
        langSelect.value = 'custom';
        document.getElementById('customLang').style.display = 'block';
        document.getElementById('customLang').value = s.srcLang;
      } else {
        langSelect.value = s.srcLang || 'en-US';
      }
      document.getElementById('audioSource').value = s.audioSource || 'mic';
      document.getElementById('rememberMe').checked = true;
    } catch (e) {}
  }
});

document.getElementById('srcLang').addEventListener('change', (e) => {
  document.getElementById('customLang').style.display = (e.target.value === 'custom') ? 'block' : 'none';
});

// 언어 코드 형식 검증 (예: en-US, nl-NL)
function isValidLangCode(code) {
  return /^[a-zA-Z]{2,3}-[a-zA-Z]{2,4}$/.test(code);
}

// 자막 두 줄(직전 문장 + 현재 문장) 갱신.
// '문장이 끝났다(recognized)'는 신호만 기다리면, 쉼 없이 계속 말하는 동안
// 이전 줄이 계속 비어 보이는 문제가 있어 - 진행 중이던 문장(finalText)보다
// 새 텍스트가 눈에 띄게 짧아지면(=새 문장이 시작된 것으로 판단) 그때 한 줄 내린다.
function updateCaptionUI(text, isFinal) {
  const prevLine = document.getElementById('prevLine');
  const curLine = document.getElementById('curLine');

  const isNewPhrase = finalText && text.length < finalText.length * 0.6;
  if (isNewPhrase) {
    prevDisplayText = finalText;
    prevLine.textContent = prevDisplayText;
  }

  finalText = text;
  curLine.textContent = text;
  curLine.className = isFinal ? 'final' : 'interim';

  if (isAppleWebKitPip) {
    updateNativeSubtitleCue(text, prevDisplayText);
  } else {
    lastCaptionText = text;
    lastPrevText = prevDisplayText;
    drawCaptionToCanvas(text, prevDisplayText);
  }
}

function stopMicStream() {
  if (rawStream) {
    rawStream.getTracks().forEach(t => t.stop());
    rawStream = null;
  }
}

// 오디오 입력을 가져온다.
// - 'mic': 기존 방식. 스피커로 재생 중인 소리를 마이크가 다시 주워듣기 때문에
//   방 잡음/울림이 그대로 인식 품질에 영향을 준다.
// - 'display': 화면/탭 공유로 오디오를 디지털로 직접 캡처(크롬 전용). 마이크를
//   거치지 않아 훨씬 깨끗한 소스를 넘길 수 있다. 공유 대상으로 "크롬 탭"을 고르고
//   "탭 오디오 공유"를 체크해야 오디오 트랙이 들어온다.
async function acquireAudioStream() {
  if (currentAudioSource === 'display') {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      throw new Error('이 브라우저는 화면/탭 오디오 공유를 지원하지 않습니다. 크롬을 사용해주세요.');
    }
    const displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    const audioTracks = displayStream.getAudioTracks();
    if (audioTracks.length === 0) {
      displayStream.getTracks().forEach(t => t.stop());
      throw new Error('공유한 화면/탭에 오디오가 없습니다. 공유 창에서 "탭 오디오 공유"를 체크했는지 확인해주세요.');
    }
    // 화면 미리보기는 필요 없으니 비디오 트랙은 바로 정리
    displayStream.getVideoTracks().forEach(t => t.stop());
    return displayStream;
  }

  // 에코 제거/노이즈 억제를 꺼서 스피커로 재생 중인 영상 소리도 그대로 인식하도록 함
  return navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false
    }
  });
}

function scheduleReconnect(reason) {
  if (isManualStop) return;

  // 네트워크 자체가 끊긴 상태면 재시도 횟수를 낭비하지 않고 online 이벤트가
  // 올 때까지 기다린다 (아래 'online' 리스너에서 즉시 재시도).
  if (!navigator.onLine) {
    awaitingNetwork = true;
    setStatus('네트워크 연결이 끊겼습니다. 연결되면 자동으로 재시도합니다.', 'warn');
    return;
  }

  reconnectAttempts++;
  if (reconnectAttempts > MAX_RECONNECT_ATTEMPTS) {
    setStatus('연결이 끊어졌습니다(' + reason + '). 중지 후 다시 시작해주세요.', 'error');
    return;
  }

  const delayMs = Math.min(1000 * (2 ** (reconnectAttempts - 1)), 16000);
  setStatus(`연결이 끊어졌습니다. ${Math.round(delayMs / 1000)}초 후 재연결 시도... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`, 'warn');

  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(() => {
    startRecognition();
  }, delayMs);
}

window.addEventListener('offline', () => {
  if (!isManualStop) setStatus('네트워크 연결이 끊겼습니다. 연결되면 자동으로 재시도합니다.', 'warn');
});

window.addEventListener('online', () => {
  if (!isManualStop && awaitingNetwork) {
    awaitingNetwork = false;
    reconnectAttempts = 0;
    clearTimeout(reconnectTimer);
    startRecognition();
  }
});

async function startRecognition() {
  if (recognizer) {
    try { recognizer.close(); } catch (e) {}
    recognizer = null;
  }
  stopMicStream();
  awaitingNetwork = false;

  try {
    const speechConfig = SpeechSDK.SpeechTranslationConfig.fromSubscription(currentKey, FIXED_REGION);
    speechConfig.speechRecognitionLanguage = currentSrcLang;
    speechConfig.addTargetLanguage('ko');

    rawStream = await acquireAudioStream();
    const audioConfig = SpeechSDK.AudioConfig.fromStreamInput(rawStream);
    recognizer = new SpeechSDK.TranslationRecognizer(speechConfig, audioConfig);

    recognizer.recognizing = (s, e) => {
      reconnectAttempts = 0; // 실제로 인식이 들어오면 연결이 정상이라는 뜻이므로 재시도 횟수를 초기화
      if (e.result.translations) {
        const ko = e.result.translations.get('ko');
        if (ko) updateCaptionUI(ko, false);
      }
    };

    recognizer.recognized = (s, e) => {
      reconnectAttempts = 0;
      if (e.result.reason === SpeechSDK.ResultReason.TranslatedSpeech) {
        const ko = e.result.translations.get('ko');
        if (ko) updateCaptionUI(ko, true);
      }
    };

    recognizer.canceled = (s, e) => {
      scheduleReconnect(e.errorDetails || '알 수 없는 오류');
    };

    recognizer.sessionStopped = () => {
      scheduleReconnect('세션 종료');
    };

    recognizer.startContinuousRecognitionAsync(
      () => {
        // 주의: 이 콜백은 로컬에서 인식 루프가 시작됐다는 뜻일 뿐, 서버 인증/연결이
        // 성공했다는 보장은 아니다(키가 잘못돼도 일단 호출됨). 그래서 재시도 횟수는
        // 여기서 초기화하지 않고, 실제 recognizing/recognized 이벤트가 들어왔을 때만
        // 초기화한다 - 그래야 잘못된 키로 무한 재시도하지 않고 정해진 횟수 뒤에 멈춘다.
        document.getElementById('setup').style.display = 'none';
        document.getElementById('caption').style.display = 'flex';
        document.getElementById('controls').style.display = 'flex';
        setStatus('인식 중...', 'ok');
        startPipStream();
        requestWakeLock();
      },
      (err) => {
        setStatus('시작 실패: ' + err, 'error');
      }
    );
  } catch (err) {
    setStatus('오류 발생: ' + err.message, 'error');
  }
}

document.getElementById('startBtn').addEventListener('click', async () => {
  const startBtn = document.getElementById('startBtn');
  if (startBtn.disabled) return; // 중복 클릭 방지

  const key = document.getElementById('key').value.trim();
  const langSelectValue = document.getElementById('srcLang').value;
  const srcLang = langSelectValue === 'custom'
    ? document.getElementById('customLang').value.trim()
    : langSelectValue;
  const audioSource = document.getElementById('audioSource').value;
  const remember = document.getElementById('rememberMe').checked;

  if (!key) {
    alert('구독 키를 입력해주세요.');
    return;
  }

  if (!srcLang) {
    alert('언어 코드를 입력해주세요. 예: nl-NL');
    return;
  }

  if (!isValidLangCode(srcLang)) {
    alert('언어 코드 형식이 올바르지 않습니다. 예: en-US, nl-NL');
    return;
  }

  if (typeof SpeechSDK === 'undefined') {
    alert('SDK 로딩에 실패했습니다. 인터넷 연결을 확인해주세요.');
    return;
  }

  if (remember) {
    localStorage.setItem('captionSettings', JSON.stringify({ key, srcLang, audioSource }));
  } else {
    localStorage.removeItem('captionSettings');
  }

  currentKey = key;
  currentSrcLang = srcLang;
  currentAudioSource = audioSource;
  isManualStop = false;
  reconnectAttempts = 0;
  finalText = '';
  prevDisplayText = '';

  startBtn.disabled = true;
  startBtn.textContent = '시작 중...';
  setStatus(audioSource === 'display' ? '공유할 화면/탭을 선택해주세요...' : '마이크 권한을 요청하는 중...');

  await startRecognition();

  // 성공 시에는 setup 화면이 숨겨지므로 그대로 두고, 실패했을 때만 버튼을 복구한다
  if (document.getElementById('setup').style.display !== 'none') {
    startBtn.disabled = false;
    startBtn.textContent = '시작';
  }
});

document.getElementById('clearKeyBtn').addEventListener('click', () => {
  localStorage.removeItem('captionSettings');
  document.getElementById('key').value = '';
  document.getElementById('rememberMe').checked = false;
  setStatus('저장된 키를 삭제했습니다.');
});

// PIP 진입/종료 상태에 맞춰 버튼 라벨을 바꿔준다 (표준 API + Safari webkit API 둘 다)
function setPipBtnLabel(inPip) {
  document.getElementById('pipBtn').textContent = inPip ? 'PIP 종료' : 'PIP로 띄우기';
}
pipVideoEl.addEventListener('enterpictureinpicture', () => setPipBtnLabel(true));
pipVideoEl.addEventListener('leavepictureinpicture', () => setPipBtnLabel(false));
pipVideoEl.addEventListener('webkitpresentationmodechanged', () => {
  setPipBtnLabel(pipVideoEl.webkitPresentationMode === 'picture-in-picture');
});

// iOS Safari는 표준 Picture-in-Picture API 대신 webkit 전용 API를 쓰는 경우가 있어 둘 다 지원
document.getElementById('pipBtn').addEventListener('click', async () => {
  if (isAppleWebKitPip) {
    // 녹화가 아직 안 끝났으면 여기서 마무리될 때까지 기다림 (보통 시작 버튼을 누른 시점에 이미 준비됨)
    await prepareNativeSubtitlePip();
  }

  const usesWebkitApi = typeof pipVideoEl.webkitSupportsPresentationMode === 'function'
    && pipVideoEl.webkitSupportsPresentationMode('picture-in-picture');

  try {
    // 비디오가 실제로 재생 준비(readyState)되지 않으면 iOS에서 PIP 요청이 조용히 무시되는 경우가 있음
    if (pipVideoEl.readyState < 2) {
      await pipVideoEl.play().catch(() => {});
    }

    if (usesWebkitApi) {
      const inPip = pipVideoEl.webkitPresentationMode === 'picture-in-picture';
      pipVideoEl.webkitSetPresentationMode(inPip ? 'inline' : 'picture-in-picture');
      return;
    }

    if (!document.pictureInPictureEnabled) {
      alert('이 브라우저/기기는 Picture-in-Picture 기능을 지원하지 않습니다.');
      return;
    }

    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
      return;
    }
    await pipVideoEl.requestPictureInPicture();
  } catch (err) {
    alert('PIP 실행에 실패했어요: ' + err.message + '\n다시 한 번 눌러보시거나, 화면 밝기/저전력 모드를 확인해보세요.');
  }
});

document.getElementById('stopBtn').addEventListener('click', () => {
  isManualStop = true;
  awaitingNetwork = false;
  clearTimeout(reconnectTimer);
  reconnectTimer = null;
  releaseWakeLock();

  const finishStop = () => {
    document.getElementById('setup').style.display = 'flex';
    document.getElementById('caption').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    setStatus('');
    document.getElementById('prevLine').textContent = '';
    document.getElementById('curLine').textContent = '';
    finalText = '';
    prevDisplayText = '';
    lastCaptionText = '';
    lastPrevText = '';
    stopMicStream();

    const startBtn = document.getElementById('startBtn');
    startBtn.disabled = false;
    startBtn.textContent = '시작';
    setPipBtnLabel(false);

    if (document.pictureInPictureElement) {
      document.exitPictureInPicture().catch(() => {});
    }
    if (isAppleWebKitPip && pipVideoEl.webkitPresentationMode === 'picture-in-picture') {
      pipVideoEl.webkitSetPresentationMode('inline');
    }

    if (isAppleWebKitPip) {
      resetNativeSubtitlePip();
    } else if (pipVideoEl.srcObject) {
      pipVideoEl.srcObject.getTracks().forEach(t => t.stop());
      pipVideoEl.srcObject = null;
    }
    pipStreamStarted = false;
    if (pipDrawInterval) {
      clearInterval(pipDrawInterval);
      pipDrawInterval = null;
    }
  };

  if (recognizer) {
    recognizer.stopContinuousRecognitionAsync(() => {
      recognizer.close();
      recognizer = null;
      finishStop();
    }, () => {
      recognizer = null;
      finishStop();
    });
  } else {
    finishStop();
  }
});

// 인식 중에 탭을 닫거나 새로고침하면 진행 중인 자막/연결이 끊기므로 한 번 확인한다
window.addEventListener('beforeunload', (e) => {
  if (!isManualStop && recognizer) {
    e.preventDefault();
    e.returnValue = '';
  }
});

</script>
